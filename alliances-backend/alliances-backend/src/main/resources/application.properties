# ---- YOUR existing database (nothing is created or seeded by this project) ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# validate = only check that tables/columns match the entities, never change your DB.
# If a table is missing, the error names it. (Use "none" to skip the check.)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false

# ---- security ----
app.jwt.secret=${JWT_SECRET}
app.jwt.hours=72
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.cors.origins=${CORS_ORIGINS:http://127.0.0.1:5500,http://localhost:5500}

server.port=8080

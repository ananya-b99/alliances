<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Dashboard | Alliances</title>
        <script>if(!localStorage.getItem('alliances_session'))location.replace('login.html');</script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
        <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="dashboard.css">
    </head>
    <body>
        <div class="app">
            <aside class="sidebar" id="sidebar">
                <a class="brand" href="index.html"><img src="Alliances logo.png" alt="Alliances"></a>
                <nav id="sideNav"></nav>
                <details class="demo">
                    <summary><i class="ti ti-tool"></i> Demo tools</summary>
                    <p>Frontend-only helpers so you can test the whole flow alone.</p>
                    <button data-act="demoIncoming">Someone requests my post</button>
                    <button data-act="demoReplies">Owners reply to my requests</button>
                    <button data-act="demoSkip">Skip time (expire deadlines)</button>
                    <button data-act="demoReset">Reset demo data</button>
                </details>
            </aside>

            <div class="main">
                <header class="topbar">
                    <button class="icon-btn menu-btn" data-act="menu" aria-label="Open menu"><i class="ti ti-menu-2"></i></button>
                    <h1 id="pageTitle">Home</h1>
                    <div class="top-right">
                        <button class="icon-btn" id="bell" data-act="bell" aria-label="Notifications"><i class="ti ti-bell"></i><span class="badge" id="bellCount" hidden>0</span></button>
                        <button class="me" data-act="go" data-id="profile"><span id="meAvatar"></span><span id="meName"></span></button>
                        <button class="icon-btn" data-act="logout" aria-label="Log out" title="Log out"><i class="ti ti-logout"></i></button>
                    </div>
                    <div class="notif" id="notifPanel" hidden></div>
                </header>
                <main id="view" class="view"></main>
            </div>
        </div>

        <div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
        <div class="toast" id="toast" hidden></div>
        <script src="dashboard.js"></script>
    </body>
</html>
